; Library development: IntelliSense, and the dependency set the examples build against.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino

lib_deps =
    esp32async/ESPAsyncWebServer@^3.11.0
    esp32async/AsyncTCP@^3.4.9
    lvgl/lvgl@^9.5.0

build_flags =
    -fexceptions
    -I .    ; lv_conf.h
