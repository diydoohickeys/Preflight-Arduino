; Builds this example against the library checkout two levels up:
;   pio run -e esp32-s3 -t upload        (or open this folder in PlatformIO)
; displayFlush() is a stub: wire in your panel driver before expecting pixels.

[platformio]
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.ino> +<*.cpp>             ; top level only: .pio/ holds library sources
board_build.partitions = min_spiffs.csv    ; two 1.9 MB OTA slots + coredump, fits 4 MB
lib_deps =
    symlink://../..
    lvgl/lvgl@^9.5.0
; The library's repo-root lv_conf.h enables the fonts the boot screen uses.
; The lvgl -I is needed only because this example sits inside the library's own tree: PlatformIO
; then attributes every header under .pio/libdeps/ to Preflight, so the library never gets
; LVGL's include path and the boot UI compiles empty. A project that keeps the library elsewhere
; needs just lvgl in lib_deps.
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I ../..
    -I .pio/libdeps/$PIOENV/lvgl

; Any ESP32-S3 with >= 4 MB flash; Serial on the native USB port.
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
board = esp32dev
